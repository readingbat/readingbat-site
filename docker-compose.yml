services:
  readingbat0:
    image: "pambrose/readingbat:3.4.0"
    restart: "always"
    env_file: docker_env_vars
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8083:8083"
    volumes:
      - readingbat0-dumps:/app/dumps
  readingbat1:
    image: "pambrose/readingbat:3.4.0"
    restart: "always"
    env_file: docker_env_vars
    ports:
      - "8090:8080"
      - "8093:8083"
      - "8094:8081"
    volumes:
      - readingbat1-dumps:/app/dumps
  readingbat2:
    image: "pambrose/readingbat:3.4.0"
    restart: "always"
    env_file: docker_env_vars
    ports:
      - "8070:8080"
      - "8073:8083"
      - "8074:8081"
    volumes:
      - readingbat2-dumps:/app/dumps

volumes:
  readingbat0-dumps:
  readingbat1-dumps:
  readingbat2-dumps:
