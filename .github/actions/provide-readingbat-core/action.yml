name: Provide readingbat-core
description: >-
  Makes the catalog's readingbat-core version resolvable. settings.gradle.kts takes a version that is not on Maven
  Central from the local Maven repo, and the runner's is empty, so this builds that version from its readingbat-core
  tag and publishes it there. Run it after checkout and Gradle setup.

runs:
  using: composite
  steps:
    - name: Find the readingbat-core version
      id: core
      shell: bash
      run: |
        version=$(sed -n 's/^readingbat = "\(.*\)"/\1/p' gradle/libs.versions.toml)
        # The workflows run on pull_request, so on a fork PR the catalog is attacker-controlled, and the
        # version becomes a git ref and part of a URL below. Accept nothing but a plain release version.
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Unexpected readingbat version '$version' in gradle/libs.versions.toml" >&2
          exit 1
        fi
        on_central=true
        for artifact in readingbat-core readingbat-kotest; do
          url="https://repo1.maven.org/maven2/com/readingbat/$artifact/$version/$artifact-$version.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          case "$code" in
            200) ;;
            404) on_central=false ;;
            *) echo "Could not tell whether $artifact $version is on Maven Central (HTTP $code)" >&2; exit 1 ;;
          esac
        done
        echo "readingbat-core $version on Maven Central: $on_central"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "on-central=$on_central" >> "$GITHUB_OUTPUT"

    - name: Check out readingbat-core at its tag
      if: steps.core.outputs.on-central == 'false'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: readingbat/readingbat-core
        ref: refs/tags/${{ steps.core.outputs.version }}
        path: readingbat-core
        persist-credentials: false

    - name: Publish readingbat-core to the local Maven repo
      if: steps.core.outputs.on-central == 'false'
      working-directory: readingbat-core
      shell: bash
      run: ./gradlew publishToMavenLocal
