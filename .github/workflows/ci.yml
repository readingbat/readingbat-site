name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  # `make release-check` requires this job, by name, to have passed for HEAD (REQUIRED_CHECKS in the Makefile).
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml) bumps each SHA with its
      # trailing version comment.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Provide readingbat-core
        uses: $/.github/actions/provide-readingbat-core

      - name: Build, test, and lint
        run: ./gradlew build
